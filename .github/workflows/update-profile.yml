name: Refresh profile projects

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_projects.mjs'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: akopyan0-profile-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate fresh public project cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update_projects.mjs
      - name: Commit project updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets/projects/
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh public projects"
            git push
          fi

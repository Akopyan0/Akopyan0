<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245" role="img" aria-label="Design is a decision. So is good engineering."><title>Design is a decision. So is good engineering.</title><rect x="0" y="0" width="1200" height="245" rx="0" fill="#FCFCF8" /><rect x="0.5" y="0.5" width="1199" height="244" rx="0" fill="none" stroke="#D6DECF"/><rect x="60" y="44" width="12" height="12" rx="0" fill="#D7EF73" /><text x="84" y="55" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" letter-spacing="1.2" fill="#203328" >01 / PERSPECTIVE</text><text x="56" y="132" font-family="Arial,Helvetica,sans-serif" font-size="59" font-weight="900" letter-spacing="-3" fill="#13241A" >Design is a decision.</text><text x="56" y="199" font-family="Arial,Helvetica,sans-serif" font-size="59" font-weight="900" letter-spacing="-3" fill="#13241A" >So is good engineering.</text><line x1="882" y1="48" x2="882" y2="205" stroke="#D6DECF" stroke-width="1"/><text x="918" y="89" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0" fill="#526054" >I build products where</text><text x="918" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0" fill="#526054" >craft meets practical</text><text x="918" y="151" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0" fill="#526054" >problem solving.</text><rect x="919" y="188" width="170" height="4" rx="0" fill="#D7EF73" /></svg>
